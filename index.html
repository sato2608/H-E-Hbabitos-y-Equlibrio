<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="H&amp;E">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>H&amp;E · Hábitos y Equilibrio</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--esp:#D9B44A;--cue:#5E8C5A;--men:#6F8FA8;--bg:#F2F3EF;--acc:#4A3B32;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--acc);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0}
h1{font-size:26px;margin:6px 0 4px;line-height:1.2}h2{font-size:19px;margin:0 0 10px}h3{font-size:16px;margin:0}
p{margin:6px 0 10px}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 18px;font:inherit;font-weight:600;background:var(--acc);color:#fff;width:100%;cursor:pointer;margin-top:8px}
.btn.sec{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.btn.danger{background:#B4472F}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;margin:0}
.btn:disabled{opacity:.35;cursor:default}
input,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid rgba(0,0,0,.12);background:#fff;color:inherit;margin:4px 0}
textarea{min-height:84px;resize:vertical}
label{font-weight:600;font-size:14px;display:block;margin-top:10px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;justify-content:center;padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);border-top:1px solid rgba(0,0,0,.08);z-index:5}
.nav div{display:flex;justify-content:space-around;width:100%;max-width:520px}
.nav button{background:none;border:0;font:inherit;font-size:12px;color:var(--acc);opacity:.45;padding:4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nav button.on{opacity:1;font-weight:700}
.nav svg{width:24px;height:24px}
.muted{opacity:.65;font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.sp{flex:1}
.vh{display:flex;align-items:center;gap:8px;margin:14px 0 4px}
.vh svg{width:20px;height:20px}
.goal{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.06);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left}
.goal:disabled{cursor:default}
.chk{width:30px;height:30px;border-radius:10px;border:2.5px solid var(--c);display:flex;align-items:center;justify-content:center;flex:none;background:#fff;color:#fff;font-weight:800}
.chk.on{background:var(--c)}
.task{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.task .tx{flex:1;min-width:0;word-wrap:break-word}
.task.done .tx{text-decoration:line-through;opacity:.6}
.tb{border:2px solid rgba(0,0,0,.14);background:#fff;border-radius:10px;min-width:36px;height:36px;font:inherit;font-size:15px;color:var(--acc);cursor:pointer;padding:0 6px}
.tb.ok{background:#2E7D4F;border-color:#2E7D4F;color:#fff}.tb.no{background:#B4472F;border-color:#B4472F;color:#fff}
.tb:disabled{opacity:.35;cursor:default}
.tb.ghost{border:0;background:none;min-width:24px;opacity:.55}
.tag{font-size:11px;background:rgba(0,0,0,.07);padding:2px 8px;border-radius:99px;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:92vh;overflow:auto}
table.wk{width:100%;border-collapse:collapse;font-size:13px;text-align:center}
table.wk td,table.wk th{padding:7px 2px;border-bottom:1px solid rgba(0,0,0,.06)}
table.wk th{font-weight:600;opacity:.7}
.bar{height:10px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden;flex:1}.bar>i{display:block;height:100%;border-radius:99px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pk{background:#fff;border:3px solid transparent;border-radius:16px;padding:10px 6px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.pk.on{border-color:var(--acc)}
.pk .mimg{width:100%;height:130px}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 14px}.dots i{width:8px;height:8px;border-radius:9px;background:var(--acc);opacity:.2}.dots i.on{opacity:1}
.err{color:#B4472F;font-size:14px;margin-top:6px}
.hdr{display:flex;align-items:center;gap:12px}
.hdr .mimg{width:64px;height:64px;flex:none}
.mimg{border-radius:16px;object-fit:cover;object-position:center top;display:inline-block;background:#fff}
.bubble{background:#fff;border-radius:14px;padding:8px 12px;font-size:14px;position:relative}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav button{background:#fff;border:0;border-radius:12px;width:40px;height:40px;font-size:20px;color:var(--acc);cursor:pointer}
.daynav button:disabled{opacity:.3}
.tri{width:100%;max-width:320px;display:block;margin:0 auto}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:rgba(0,0,0,.04);border-radius:14px;padding:12px}
.stat b{font-size:24px;display:block}
.lock{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pin{font-size:28px;letter-spacing:12px;text-align:center;max-width:220px}
.banner{background:#FCE9C8;border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.logo{font-size:44px;font-weight:800;letter-spacing:-1px}
@keyframes stp{0%,8%{opacity:0}22%,72%{opacity:1}88%,100%{opacity:0}}
.st{animation:stp 2.4s ease-in-out infinite}.st2{animation-delay:.7s}
@keyframes pop{0%{transform:scale(.85)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
.unl{animation:pop .8s ease-out 1;transform-box:fill-box;transform-origin:center}
.tri{max-width:340px}
</style>
</head>

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const today=()=>ymd(new Date());
const dow=s=>(pd(s).getDay()+6)%7;
const monday=s=>addD(s,-dow(s));
const addMonths=(s,n)=>{const d=pd(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)};
const firstOfMonth=s=>s.slice(0,8)+'01';
const lastOfMonth=s=>{const d=pd(s);return ymd(new Date(d.getFullYear(),d.getMonth()+1,0))};
const range=(a,b)=>{const r=[];for(let x=a;x<=b;x=addD(x,1))r.push(x);return r};
const fmt=s=>{const d=pd(s);return DIAS[dow(s)]+' '+d.getDate()+' de '+MESES[d.getMonth()]};
const fmtS=s=>{const d=pd(s);return d.getDate()+' de '+MESES[d.getMonth()]};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const dynWeek=s=>{const m=monday(s),su=addD(m,6),f=firstOfMonth(s),l=lastOfMonth(s);return[m<f?f:m,su>l?l:su]};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);

const lines=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);

function applyPal(a){const p=PAL[a]||PAL.oso;const r=document.documentElement.style;VK.forEach(k=>r.setProperty('--'+k,p[k]));r.setProperty('--bg',p.bg);r.setProperty('--acc',p.acc);
 let m=document.querySelector('meta[name=theme-color]');if(!m){m=document.createElement('meta');m.name='theme-color';document.head.appendChild(m)}m.content=p.bg}

const b64=u=>{let s='';u.forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pin,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function setPin(pin){const salt=crypto.getRandomValues(new Uint8Array(16));SALT=b64(salt);KEY=await deriveKey(pin,salt);S.profile.pin=true}
let saving=Promise.resolve();
function save(){saving=saving.then(persist);return saving}
async function persist(){if(!S)return;try{let out;
 if(S.profile.pin&&KEY){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,new TextEncoder().encode(JSON.stringify(S)));out={enc:1,salt:SALT,iv:b64(iv),ct:b64(new Uint8Array(ct))}}
 else out={enc:0,data:S};
 localStorage.setItem(LS,JSON.stringify(out));localStorage.setItem(LSA,S.profile.animal);storageOK=true}catch(e){storageOK=false}}
function wipe(){try{localStorage.removeItem(LS);localStorage.removeItem(LSF);localStorage.removeItem(LSA)}catch(e){}S=null;KEY=null;SALT=null;
 Object.assign(U,{mode:'ob',tab:'hoy',day:today(),week:today(),step:0,ob:{name:'',age:'',animal:'oso',pinOn:null,goals:{esp:'',cue:'',men:''}},modal:null,err:'',lockMsg:''});applyPal('oso')}

function rec(day){if(!S.checks[day])S.checks[day]={g:clone(S.goals),d:{}};return S.checks[day]}
function inRange(day){return day>=S.profile.start&&day<=today()}
function vpct(k,a,b){const st=S.profile.start,T=today();if(a<st)a=st;if(b>T)b=T;if(a>b)return null;let tot=0,ok=0;
 range(a,b).forEach(d=>{const r=rec(d);(r.g[k]||[]).forEach(g=>{tot++;if(r.d[g.id])ok++})});return tot?ok/tot:null}
function tstats(a,b){const T=today();const ts=S.tasks.filter(t=>t.date>=a&&t.date<=b);const done=ts.filter(t=>t.status==='hecho').length;
 let e=b>T?T:b;let s=a<S.profile.start?S.profile.start:a;const days=e>=s?diff(e,s)+1:0;
 return{total:ts.length,done,pct:ts.length?done/ts.length:null,avg:days?done/days:null,days}}
function streak(k){const T=today(),st=S.profile.start;const full=d=>{const r=rec(d);const g=r.g[k]||[];return g.length>0&&g.every(x=>r.d[x.id])};
 let d=T,n=0;if(!full(d))d=addD(d,-1);while(d>=st&&full(d)){n++;d=addD(d,-1)}return n}
function goalsEditable(day){const df=diff(today(),day);return day>=S.profile.start&&df>=0&&df<=1}
function tasksEditable(day){const df=diff(today(),day);return df<=3}
function changeInfo(k){const T=today(),st=S.profile.start,ch=S.changes[k]||[];const ym=T.slice(0,7);const inMonth=ch.filter(c=>c.slice(0,7)===ym).length;
 const nm=addD(lastOfMonth(T),1);
 if(T<addMonths(st,3)){const wk=monday(T);const inWeek=ch.some(c=>c>=wk);
  if(inMonth>=3)return{ok:false,msg:`Ya usaste los 3 cambios de este mes. El próximo se libera el ${fmtS(nm)}.`};
  if(inWeek)return{ok:false,msg:`Ya cambiaste este vértice esta semana. Próximo cambio: lunes ${fmtS(addD(wk,7))}.`};
  return{ok:true,msg:`Te quedan ${3-inMonth} de 3 cambios este mes (máximo 1 por semana).`}}
 if(inMonth>=1)return{ok:false,msg:`Ya hiciste el cambio de este mes. El próximo se libera el ${fmtS(nm)}.`};
 return{ok:true,msg:'Tienes 1 cambio disponible este mes.'}}

function wscore(a,b){const t=tstats(a,b).pct;const ps=VK.map(k=>vpct(k,a,b)).filter(x=>x!=null);const tri=ps.length?ps.reduce((x,y)=>x+y,0)/ps.length:null;
 if(t==null&&tri==null)return null;return{sc:t==null?tri:tri==null?t:.7*t+.3*tri,t,tri}}
function showModal(m){if(U.modal)(U.mq=U.mq||[]).push(m);else U.modal=m}
function checks(){const T=today(),st=S.profile.start;
 if(dow(T)>=1){const pm=addD(monday(T),-7),ps=addD(pm,6);if(st<=ps&&S.weekChecked!==pm){S.weekChecked=pm;const w=wscore(pm,ps);if(w&&w.sc<.65){S.needMsg=monday(T);showModal({type:'weekmsg',w})}}}
 let m=firstOfMonth(st);const nw=[];
 while(addD(lastOfMonth(m),4)<=T){if(!S.monthsDone.includes(m)){S.monthsDone.push(m);const w=wscore(m<st?st:m,lastOfMonth(m));if(w&&w.sc>=.75&&S.awards.length<12){S.awards.push({m,sc:w.sc});nw.push(S.awards.length-1)}}m=addD(lastOfMonth(m),1)}
 nw.forEach(i=>showModal({type:'award',i}))}

function piece(i,w){const c=i%3,r=Math.floor(i/3);return `<div style="width:${w||'100%'};aspect-ratio:3/4;background-image:url(${PUZ});background-size:300% 400%;background-position:${c*50}% ${(r*100/3).toFixed(3)}%;border-radius:6px"></div>`}
function afterLoad(){U.mode='main';S.monthsDone=S.monthsDone||[];S.awards=S.awards||[];if(S.porque==null)S.porque='';if(!S.weekChecked)S.weekChecked=S.lastPhraseWeek||monday(S.profile.start);applyPal(S.profile.animal);if(inRange(today()))rec(today());checks();save();render()}

async function tryUnlock(pin){let raw;try{raw=JSON.parse(localStorage.getItem(LS))}catch(e){raw=null}if(!raw){wipe();render();return}
 try{const k=await deriveKey(pin,ub64(raw.salt));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(raw.iv)},k,ub64(raw.ct));
  S=JSON.parse(new TextDecoder().decode(pt));KEY=k;SALT=raw.salt;try{localStorage.setItem(LSF,'0')}catch(e){}U.lockMsg='';afterLoad()}
 catch(e){let f=0;try{f=+(localStorage.getItem(LSF)||0)+1;localStorage.setItem(LSF,String(f))}catch(_){f=6}
  if(f>=6){wipe();U.err='Se superaron los intentos permitidos. La app se reinició y tus datos se borraron.'}
  else if(f===5)U.lockMsg='Clave incorrecta. Te queda un intento: si fallas, la app se reiniciará y perderás tus datos.';
  else U.lockMsg=`Clave incorrecta. Intento ${f} de 5.`;render()}}

function triSVG(p,a){a=PAL[a]?a:'oso';const P={esp:[160,62],cue:[64,226],men:[256,226]};const c=[160,172];const R=44,C=2*Math.PI*R,IR=37;
 const icon={esp:`<image href="${PEND[a]}" x="-38" y="-38" width="76" height="76" preserveAspectRatio="xMidYMid slice"/>`,
  cue:`<circle r="38" fill="var(--cue)" fill-opacity=".12"/><g transform="translate(-11 11) rotate(-12)"><g class="st st1" fill="var(--cue)">${FOOT[a]}</g></g><g transform="translate(11 -11) rotate(12)"><g class="st st2" fill="var(--cue)">${FOOT[a]}</g></g>`,
  men:`<circle r="38" fill="var(--men)" fill-opacity=".12"/><g transform="translate(0 4) scale(1.05)">${HAT[a]}</g>`};
 let s=`<svg viewBox="0 0 320 318" class="tri" role="img" aria-label="Triángulo de equilibrio"><defs>`;
 VK.forEach(k=>{const v=Math.max(0,Math.min(1,p[k]||0));const h=76*v;s+=`<clipPath id="cc_${k}"><circle r="${IR}"/></clipPath><clipPath id="rv_${k}"><rect x="-40" y="${(38-h).toFixed(1)}" width="80" height="${h.toFixed(1)}"/></clipPath>`});
 s+=`</defs><polygon points="160,62 64,226 256,226" fill="none" stroke="var(--acc)" stroke-opacity=".2" stroke-width="3" stroke-linejoin="round"/>`;
 const ip=VK.map(k=>{const v=P[k],q=Math.max(.05,Math.min(1,p[k]||0));return(c[0]+(v[0]-c[0])*q).toFixed(1)+','+(c[1]+(v[1]-c[1])*q).toFixed(1)}).join(' ');
 s+=`<polygon points="${ip}" fill="var(--acc)" fill-opacity=".08" stroke="var(--acc)" stroke-opacity=".35" stroke-width="2" stroke-linejoin="round"/>`;
 VK.forEach(k=>{const[x,y]=P[k];const v=Math.max(0,Math.min(1,p[k]||0));const un=v>=1;
  s+=`<g transform="translate(${x} ${y})"><g class="${un?'unl':''}"><circle r="${R+5}" fill="#fff"/><circle r="${R}" fill="none" stroke="var(--${k})" stroke-opacity=".2" stroke-width="6"/><circle r="${R}" fill="none" stroke="var(--${k})" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(C*v).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90)"/>
  <g clip-path="url(#cc_${k})"><g opacity="${un?1:.13}">${icon[k]}</g>${un?'':`<g clip-path="url(#rv_${k})">${icon[k]}</g>`}</g>
  ${un?`<g transform="translate(33 -33)"><circle r="11" fill="var(--${k})" stroke="#fff" stroke-width="2"/><path d="M-5 0 L-1.5 4 L5.5 -4" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`:''}</g></g>`});
 const L=(x,y,k)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--acc)" stroke="var(--card)" stroke-width="4" paint-order="stroke">${VN[k]} · ${pctTxt(p[k])}</text>`;
 s+=L(160,130,'esp')+L(64,296,'cue')+L(256,296,'men')+'</svg>';return s}
function triHint(p,a){a=PAL[a]?a:'oso';const it={esp:'el amuleto de madera',cue:FOOTN[a],men:HATN[a]};const un=VK.filter(k=>(p[k]||0)>=1);
 return `<p class="muted" style="text-align:center;margin:4px 0 0">${un.length?`¡Desbloqueaste ${un.map(k=>it[k]).join(', ')}! `:''}${un.length<3?`Llega al 100% esta semana para revelar ${VK.filter(k=>!un.includes(k)).map(k=>it[k]).join(', ')}.`:'¡Triángulo completo esta semana!'}</p>`}

function dots(n){let s='<div class="dots">';for(let i=0;i<6;i++)s+=`<i class="${i<=n?'on':''}"></i>`;return s+'</div>'}
function rOb(){const o=U.ob,st=U.step;let h=dots(st);const err=U.err?`<div class="err">${esc(U.err)}</div>`:'';
 if(st===0){h+=`<div class="card" style="text-align:center"><div class="logo">H&amp;E</div><h2>Hábitos y Equilibrio</h2><p class="muted">Crea tu ritmo</p>

  <p>Una agenda para cuidar tu espíritu, tu cuerpo y tu mente, un día a la vez.</p>${err}<button class="btn" data-a="obNext">Empezar</button></div>`}
 else if(st===1){h+=`<div class="card"><h2>El triángulo del equilibrio</h2>${triSVG({esp:1,cue:.6,men:.35},U.ob.animal)}<p class="muted" style="text-align:center">Cada vértice esconde un premio de tu compañero que se revela a medida que te acercas al 100% de la semana.</p>
  <p>Como un aprendiz que, en cada etapa de su camino, descubre una nueva fuerza, aquí vas a trabajar tres partes de ti todos los días:</p>
  ${VK.map(k=>`<div class="vh">${ico(k)}<h3>${VN[k]}</h3></div><p class="muted" style="margin-top:0">${VD[k]}</p>`).join('')}
  <p>El equilibrio no llega de golpe: se construye con lo que haces cada día. Tu tarea es encontrar tu ritmo.</p>
  <button class="btn" data-a="obNext">Continuar</button><button class="btn sec" data-a="obBack">Atrás</button></div>`}
 else if(st===2){h+=`<div class="card"><h2>Cuéntanos de ti</h2><label for="obName">¿Cómo te llamas?</label><input id="obName" value="${esc(o.name)}" autocomplete="given-name" data-focus>
  <label for="obAge">¿Cuántos años tienes?</label><input id="obAge" type="number" inputmode="numeric" min="5" max="120" value="${esc(o.age)}">
  <p class="muted">Tus datos se quedan solo en este dispositivo.</p>${err}<button class="btn" data-a="obNext">Continuar</button><button class="btn sec" data-a="obBack">Atrás</button></div>`}
 else if(st===3){const p=PAL[o.animal];h+=`<div class="card"><h2>Elige tu compañero</h2><p class="muted">Te acompañará en tu camino. Los colores de la app seguirán su hábitat.</p>
  <div class="pick">${Object.keys(PAL).map(a=>`<button class="pk ${o.animal===a?'on':''}" data-a="obAnimal" data-v="${a}">${mascot(a)}<b style="display:block;font-size:14px">${PAL[a].n}</b><span class="muted" style="font-size:12px">${PAL[a].hab}</span></button>`).join('')}</div>
  <div class="bubble" style="margin-top:12px"><b>${p.n}</b> · ${p.per}<br>${p.hi}</div>
  <button class="btn" data-a="obNext">Continuar</button><button class="btn sec" data-a="obBack">Atrás</button></div>`}
 else if(st===4){h+=`<div class="card"><h2>¿Quieres proteger la app con una clave?</h2><p class="muted">Una clave de 4 dígitos mantiene tu agenda privada. Se pide cada vez que abres la app después de cerrarla.</p>
  <div class="row"><button class="btn ${o.pinOn===true?'':'sec'}" data-a="obPin" data-v="1">Sí, usar clave</button><button class="btn ${o.pinOn===false?'':'sec'}" data-a="obPin" data-v="0">No, gracias</button></div>
  ${o.pinOn?`<label for="obP1">Escribe tu clave</label><input id="obP1" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><label for="obP2">Repítela</label><input id="obP2" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
  <div class="banner">Importante: si olvidas la clave no hay forma de recuperarla; la app se reinicia y se pierden los datos. Tras 5 intentos fallidos te queda uno solo.</div>`:''}
  ${err}<button class="btn" data-a="obNext" ${o.pinOn==null?'disabled':''}>Continuar</button><button class="btn sec" data-a="obBack">Atrás</button></div>`}
 else{h+=`<div class="card"><h2>Tus metas diarias</h2><p class="muted">Escribe una meta por línea, máximo ${MAXG} por vértice. Consejo: metas pequeñas y concretas se cumplen más. Mejor "caminar 15 minutos" que "hacer ejercicio".</p>
  ${VK.map(k=>`<div class="vh">${ico(k)}<h3>${VN[k]}</h3></div><p class="muted" style="margin-top:0">${GUIDE[k]}</p><textarea id="obG_${k}" placeholder="${esc(VEX[k])}">${esc(o.goals[k])}</textarea>`).join('')}
  <div class="banner">Las metas no se cambian a cada rato: en los primeros 3 meses puedes cambiar cada vértice 1 vez por semana (máximo 3 al mes); después, 1 vez al mes.</div>
  ${err}<button class="btn" data-a="obFinish">Comenzar mi camino</button><button class="btn sec" data-a="obBack">Atrás</button></div>`}
 return h}

function rLock(){let a='oso';try{a=localStorage.getItem(LSA)||'oso'}catch(e){}if(!PAL[a])a='oso';
 return `<div class="lock">${mascot(a,130)}<h1>H&amp;E</h1><p class="muted">Escribe tu clave</p>
 <input id="pin" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" data-focus>
 ${U.lockMsg?`<div class="err" style="max-width:300px">${esc(U.lockMsg)}</div>`:''}<button class="btn" style="max-width:260px" data-a="unlock">Entrar</button>
 <p class="muted" style="margin-top:24px;max-width:300px">¿Olvidaste la clave? La única opción es reiniciar la app, y se borran los datos.</p><button class="btn sec sm" data-a="askReset">Reiniciar la app</button></div>`}

function header(){const T=today();const[a,b]=dynWeek(T);const ps=VK.map(k=>vpct(k,a,b)).filter(x=>x!=null);const avg=ps.length?ps.reduce((x,y)=>x+y,0)/ps.length:null;
 const P=PAL[S.profile.animal];const msg=avg==null?P.hi:(avg>=.7?P.ok:P.lo);
 return `<div class="hdr">${mascot(S.profile.animal)}<div><div style="font-weight:700;font-size:18px">Hola, ${esc(S.profile.name)}</div><div class="bubble">${esc(msg)}</div></div></div>
 ${storageOK?'':'<div class="banner">Este navegador no está guardando tus datos. Descarga una copia de seguridad en Ajustes.</div>'}`}

function rMain(){let h=header();
 if(U.tab==='hoy')h+=rHoy();else if(U.tab==='sem')h+=rSem();else if(U.tab==='pro')h+=rPro();else h+=rAju();
 const tabs=[['hoy','Hoy'],['sem','Semana'],['pro','Progreso'],['aju','Ajustes']];
 h+=`<nav class="nav"><div>${tabs.map(([k,n])=>`<button class="${U.tab===k?'on':''}" data-a="tab" data-v="${k}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${NAVI[k]}</svg>${n}</button>`).join('')}</div></nav>`;return h}

function rHoy(){const T=today(),D=U.day,st=S.profile.start;const[a,b]=dynWeek(D);
 let h=`<div class="card"><div class="daynav"><button data-a="day" data-v="-1" ${D<=st?'disabled':''} aria-label="Día anterior">‹</button><div style="text-align:center"><b>${D===T?'Hoy':cap(fmt(D))}</b>${D===T?`<div class="muted">${cap(fmt(D))}</div>`:`<div><button class="btn sm sec" style="margin-top:4px" data-a="goToday">Volver a hoy</button></div>`}</div><button data-a="day" data-v="1" aria-label="Día siguiente">›</button></div></div>`;
 h+=`<div class="card"><h2 style="margin:0">Tu triángulo</h2><p class="muted" style="margin:0 0 6px">Semana del ${fmtS(a)} al ${fmtS(b)}</p>${(()=>{const tp={esp:vpct('esp',a,b),cue:vpct('cue',a,b),men:vpct('men',a,b)};return triSVG(tp,S.profile.animal)+triHint(tp,S.profile.animal)})()}</div>`;
 if(D===T){const wk=monday(T);if(S.weekMsg&&S.weekMsg.week===wk)h+=`<div class="card" style="border:3px solid var(--acc)"><div class="muted">Tu mensaje para esta semana</div><p style="font-size:18px;font-weight:600;margin:6px 0 0">${esc(S.weekMsg.text)}</p></div>`;
  else if(S.needMsg===wk)h+=`<div class="card"><b>Escríbete un mensaje para esta semana</b><p class="muted">La semana pasada estuvo por debajo del 65%. Un mensaje tuyo te ayudará a enfocarte.</p><button class="btn sm" data-a="openMsg">Escribir mi mensaje</button></div>`;
  if(T<addMonths(st,1))h+=U.editPq||!S.porque?`<div class="card"><b>Mi porqué</b><p class="muted">¿Por qué empiezas este camino? Puedes escribirlo o ajustarlo durante tu primer mes. Lo guardaremos para recordártelo cuando lo necesites.</p><textarea id="pq">${esc(S.porque)}</textarea><button class="btn sm" data-a="savePq">Guardar</button></div>`
   :`<div class="card"><div class="row"><b>Mi porqué</b><span class="sp"></span><button class="btn sm sec" data-a="editPq">Editar</button></div><p style="margin-bottom:0">${esc(S.porque)}</p><p class="muted" style="margin:4px 0 0">Lo puedes editar hasta el ${fmtS(addMonths(st,1))}.</p></div>`}
 if(D>=st&&D<=T){const r=rec(D),ed=goalsEditable(D);
  h+=`<div class="card"><h2>Metas del día</h2>${ed?'':'<div class="banner">Este día ya está cerrado. Las metas solo se pueden marcar hasta el día siguiente.</div>'}`;
  VK.forEach(k=>{h+=`<div class="vh">${ico(k)}<h3>${VN[k]}</h3></div>`;(r.g[k]||[]).forEach(g=>{const on=!!r.d[g.id];
   h+=`<button class="goal" style="--c:var(--${k})" data-a="goal" data-v="${g.id}" ${ed?'':'disabled'} aria-pressed="${on}"><span class="chk ${on?'on':''}">${on?'✓':''}</span><span>${esc(g.text)}</span></button>`})});
  h+='</div>'}
 else if(D>T){h+=`<div class="card"><p class="muted">Las metas del triángulo se marcan el mismo día. Aquí puedes ir planeando tus tareas.</p></div>`}
 h+=rTasks(D);return h}

function rTasks(D){const T=today();const ed=tasksEditable(D);const own=S.tasks.filter(t=>t.date===D).sort((x,y)=>x.order-y.order);
 const carried=D===T?S.tasks.filter(t=>t.date<T&&!t.status).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.order-y.order):[];
 let h=`<div class="card"><h2>Tareas ${D===T?'de hoy':'del día'}</h2>`;
 if(!ed)h+='<div class="banner">Este día ya está bloqueado. Las tareas se pueden editar hasta 3 días después.</div>';
 const row=(t,i,list,isC)=>{const can=isC||ed;return `<div class="task ${t.status==='hecho'?'done':''}">
  ${!isC&&can?`<div style="display:flex;flex-direction:column"><button class="tb ghost" data-a="tmove" data-v="${t.id}" data-d="-1" ${i===0?'disabled':''} aria-label="Subir">▲</button><button class="tb ghost" data-a="tmove" data-v="${t.id}" data-d="1" ${i===list.length-1?'disabled':''} aria-label="Bajar">▼</button></div>`:''}
  <div class="tx">${esc(t.text)} ${isC?`<span class="tag">del ${DIAS[dow(t.date)]} ${pd(t.date).getDate()}</span>`:''}${t.from?`<span class="tag">venía del ${DIAS[dow(t.from)]} ${pd(t.from).getDate()}</span>`:''}</div>
  <button class="tb ${t.status==='hecho'?'ok':''}" data-a="tstat" data-v="${t.id}" data-s="hecho" ${can?'':'disabled'} title="Se hizo" aria-label="Se hizo">✓</button>
  <button class="tb ${t.status==='no'?'no':''}" data-a="tstat" data-v="${t.id}" data-s="no" ${can?'':'disabled'} title="No se pudo hacer" aria-label="No se pudo hacer">✗</button>
  ${!isC&&can?`<button class="tb ghost" data-a="tdel" data-v="${t.id}" aria-label="Eliminar">🗑</button>`:''}</div>`};
 if(carried.length){h+=`<p class="muted" style="margin-bottom:0">Pendientes de días anteriores</p>`;carried.forEach((t,i)=>h+=row(t,i,carried,true))}
 if(own.length){if(carried.length)h+=`<p class="muted" style="margin-bottom:0">Del día</p>`;own.forEach((t,i)=>h+=row(t,i,own,false))}
 if(!own.length&&!carried.length)h+='<p class="muted">Aún no hay tareas para este día.</p>';
 if(ed)h+=`<div class="row" style="margin-top:10px"><input id="newTask" placeholder="Nueva tarea…" enterkeyhint="done" style="margin:0"><button class="btn sm" data-a="tadd">Agregar</button></div>
  <p class="muted" style="margin-top:8px">✓ se hizo · ✗ no se pudo hacer. Si no marcas ninguna, la tarea pasa al día siguiente.</p>`;
 return h+'</div>'}

function rSem(){const T=today(),st=S.profile.start;const[a,b]=dynWeek(U.week);const days=range(a,b);
 const prevW=dynWeek(addD(a,-1)),nextW=dynWeek(addD(b,1));
 let h=`<div class="card"><div class="daynav"><button data-a="week" data-v="${prevW[0]}" ${b<=st||a<=st?'disabled':''} aria-label="Semana anterior">‹</button><div style="text-align:center"><b>Semana del ${fmtS(a)} al ${fmtS(b)}</b><div class="muted">${days.length} ${days.length===1?'día':'días'} · ${cap(MESES[pd(a).getMonth()])}</div></div><button data-a="week" data-v="${nextW[0]}" ${a>=monday(T)&&nextW[0]>T?'disabled':''} aria-label="Semana siguiente">›</button></div></div>`;
 h+=`<div class="card" style="overflow-x:auto"><table class="wk"><tr><th></th>${days.map(d=>`<th>${DC[dow(d)]}<br>${pd(d).getDate()}</th>`).join('')}</tr>`;
 VK.forEach(k=>{h+=`<tr><td style="text-align:left">${ico(k,18)}</td>${days.map(d=>{if(d<st||d>T)return'<td class="muted">·</td>';const r=rec(d);const g=r.g[k]||[];const ok=g.filter(x=>r.d[x.id]).length;const full=g.length&&ok===g.length;
  return `<td style="${full?`background:var(--${k});color:#fff;font-weight:700;border-radius:8px`:''}">${ok}/${g.length}</td>`}).join('')}</tr>`});
 h+=`<tr><td style="text-align:left;font-size:12px">Tareas</td>${days.map(d=>{const ts=S.tasks.filter(t=>t.date===d);if(!ts.length)return'<td class="muted">·</td>';return`<td>${ts.filter(t=>t.status==='hecho').length}/${ts.length}</td>`}).join('')}</tr></table></div>`;
 const ts=tstats(a,b);
 h+=`<div class="card"><h2>Resultados de la semana</h2>${VK.map(k=>{const p=vpct(k,a,b);return`<div class="row" style="margin:10px 0">${ico(k)}<span style="width:72px">${VN[k]}</span><div class="bar"><i style="width:${Math.round((p||0)*100)}%;background:var(--${k})"></i></div><b style="width:44px;text-align:right">${pctTxt(p)}</b></div>`}).join('')}
 <div class="stat" style="margin-top:14px"><div><span class="muted">Tareas cumplidas</span><b>${pctTxt(ts.pct)}</b><span class="muted">${ts.done} de ${ts.total}</span></div><div><span class="muted">Promedio por día</span><b>${ts.avg==null?'–':ts.avg.toFixed(1)}</b><span class="muted">actividades hechas</span></div></div>
 ${(()=>{const w=wscore(a,b);return w?`<div style="margin-top:14px;background:rgba(0,0,0,.04);border-radius:14px;padding:12px"><span class="muted">Puntaje de la semana</span><b style="font-size:28px;display:block">${pctTxt(w.sc)}</b><span class="muted">70% tareas (${pctTxt(w.t)}) + 30% triángulo (${pctTxt(w.tri)}). Si queda por debajo de 65%, el martes te escribes un mensaje.</span></div>`:''})()}
 <p class="muted" style="margin-top:10px">Se mide solo con los días que ya pasaron.</p></div>`;return h}

function rPro(){const T=today(),st=S.profile.start;let months=[];let m=firstOfMonth(st);while(m<=T){months.push(m);m=addD(lastOfMonth(m),1)}months.reverse();
 const[a,b]=[firstOfMonth(T),T];const cur=VK.map(k=>({k,p:vpct(k,a,b)})).filter(x=>x.p!=null).sort((x,y)=>x.p-y.p);
 let h=`<div class="card"><h2>Rachas</h2><p class="muted" style="margin-top:0">Días seguidos cumpliendo todas las metas del vértice.</p><div class="stat" style="grid-template-columns:1fr 1fr 1fr">${VK.map(k=>`<div style="text-align:center">${ico(k,22)}<b>${streak(k)}</b><span class="muted">${VN[k]}</span></div>`).join('')}</div>
 ${cur.length?`<div class="banner" style="margin-top:12px">Tu vértice más débil este mes es <b>${VN[cur[0].k]}</b> (${pctTxt(cur[0].p)}). Ponle un poco más de atención.</div>`:''}</div>`;
 h+=`<div class="card"><h2>Rompecabezas de Colombia</h2><p class="muted" style="margin-top:0">Cada mes con puntaje de 75% o más te da una ficha y un dato sobre las regiones y la fauna de Colombia. ${S.awards.length} de 12 fichas.</p>
 <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:3px;max-width:320px;margin:0 auto">${Array.from({length:12},(_,i)=>PORD.slice(0,S.awards.length).includes(i)?piece(i):`<div style="aspect-ratio:3/4;border-radius:6px;background:rgba(0,0,0,.07);display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.5">?</div>`).join('')}</div>
 ${S.awards.length?`<details style="margin-top:12px"><summary class="muted">Tus datos de Colombia (${S.awards.length})</summary>${S.awards.map((x,i)=>`<p style="font-size:14px"><b>${cap(MESES[pd(x.m).getMonth()])} ${pd(x.m).getFullYear()} · ${pctTxt(x.sc)}</b><br>${DATOS[i]}</p>`).join('')}</details>`:''}</div>`;
 if(S.porque)h+=`<div class="card"><h2>Mi porqué</h2><p style="margin:0">${esc(S.porque)}</p></div>`;
 h+=`<div class="card"><h2>Mes a mes</h2>${months.map(m=>{const e=lastOfMonth(m)>T?T:lastOfMonth(m);const ts=tstats(m,e);return `<div style="margin:12px 0 16px"><b>${cap(MESES[pd(m).getMonth()])} ${pd(m).getFullYear()}</b>
  ${VK.map(k=>{const p=vpct(k,m,e);return`<div class="row" style="margin:6px 0">${ico(k,16)}<div class="bar"><i style="width:${Math.round((p||0)*100)}%;background:var(--${k})"></i></div><span style="width:44px;text-align:right">${pctTxt(p)}</span></div>`}).join('')}
  <div class="muted">Tareas: ${pctTxt(ts.pct)} (${ts.done} de ${ts.total})${(()=>{const w=wscore(m<st?st:m,e);return w?` · Puntaje del mes: <b>${pctTxt(w.sc)}</b>`:''})()}</div></div>`}).join('')}</div>`;return h}

function rAju(){const p=S.profile;let h=`<div class="card"><h2>Perfil</h2><label for="aName">Nombre</label><input id="aName" value="${esc(p.name)}"><label for="aAge">Edad</label><input id="aAge" type="number" inputmode="numeric" value="${esc(p.age)}"><button class="btn sm" style="margin-top:8px" data-a="saveProfile">Guardar perfil</button><p class="muted">Empezaste el ${fmtS(p.start)} de ${pd(p.start).getFullYear()}.</p></div>`;
 h+=`<div class="card"><h2>Compañero</h2><div class="pick">${Object.keys(PAL).map(a=>`<button class="pk ${p.animal===a?'on':''}" data-a="setAnimal" data-v="${a}">${mascot(a)}<b style="display:block;font-size:13px">${PAL[a].n}</b></button>`).join('')}</div></div>`;
 h+=`<div class="card"><h2>Metas del triángulo</h2>`;
 VK.forEach(k=>{const ci=changeInfo(k);h+=`<div class="vh">${ico(k)}<h3>${VN[k]}</h3></div>`;
  if(U.editK===k){h+=`<textarea id="eG" data-focus>${esc(S.goals[k].map(g=>g.text).join('\n'))}</textarea><p class="muted">Una meta por línea, máximo ${MAXG}. Guardar cuenta como 1 cambio de ${VN[k]}.</p>${U.err?`<div class="err">${esc(U.err)}</div>`:''}<div class="row"><button class="btn sm" data-a="saveGoals" data-v="${k}">Guardar</button><button class="btn sm sec" data-a="cancelGoals">Cancelar</button></div>`}
  else{h+=`<ul style="margin:4px 0 6px;padding-left:20px">${S.goals[k].map(g=>`<li>${esc(g.text)}</li>`).join('')}</ul><p class="muted" style="margin:0 0 6px">${ci.msg}</p><button class="btn sm sec" data-a="editGoals" data-v="${k}" ${ci.ok?'':'disabled'}>Cambiar metas</button>`}});
 if(S.goalHist.length)h+=`<details style="margin-top:14px"><summary class="muted">Historial de cambios (${S.goalHist.length})</summary>${S.goalHist.slice().reverse().map(x=>`<p style="font-size:14px"><b>${fmtS(x.date)} · ${VN[x.k]}</b><br><span class="muted">Antes: ${esc(x.before.join(', '))}</span><br>Ahora: ${esc(x.after.join(', '))}</p>`).join('')}</details>`;
 h+='</div>';
 h+=`<div class="card"><h2>Clave</h2>${p.pin?'<p class="muted">Tu app está protegida con una clave de 4 dígitos y tus datos están cifrados.</p><div class="row"><button class="btn sm sec" data-a="pinModal">Cambiar clave</button><button class="btn sm sec" data-a="pinOff">Quitar clave</button></div>':'<p class="muted">La app no pide clave.</p><button class="btn sm" data-a="pinModal">Activar clave</button>'}</div>`;
 h+=`<div class="card"><h2>Copia de seguridad</h2><p class="muted">Guarda una copia de vez en cuando. Si cambias de teléfono o la app se reinicia, la puedes restaurar. La copia no va cifrada: guárdala en un lugar seguro.</p>
 <div class="row" style="flex-wrap:wrap"><button class="btn sm" data-a="exportFile">Descargar copia</button><button class="btn sm sec" data-a="exportCopy">Copiar al portapapeles</button><button class="btn sm sec" data-a="importModal">Restaurar copia</button></div>${U.flash?`<p class="muted">${esc(U.flash)}</p>`:''}</div>`;
 h+=`<div class="card"><h2>Reiniciar</h2><p class="muted">Borra todos tus datos de este dispositivo y vuelve a empezar.</p><button class="btn sm danger" data-a="askReset">Reiniciar la app</button></div><p class="muted" style="text-align:center">H&amp;E · Hábitos y Equilibrio · versión ${VERSION}</p>`;return h}

function rModal(){const m=U.modal;let h='<div class="modal"><div class="sheet" role="dialog" aria-modal="true">';
 if(m.type==='weekmsg'){const a=S.profile.animal,w=m.w;h+=`<div style="text-align:center">${mascot(a,110)}<h2>Es hora de enfocarte</h2>${w?`<p class="muted">Tu semana pasada: <b>${pctTxt(w.sc)}</b> (tareas ${pctTxt(w.t)} · triángulo ${pctTxt(w.tri)})</p>`:''}</div>
  ${S.porque?`<div class="card"><div class="muted">Recuerda tu porqué</div><p style="margin:4px 0 0;font-weight:600">${esc(S.porque)}</p></div>`:''}
  <label for="wmText">Escríbete un mensaje para esta semana</label><textarea id="wmText" placeholder="Ej.: Esta semana me enfoco en…" data-focus></textarea>${U.err?`<div class="err">${esc(U.err)}</div>`:''}<button class="btn" data-a="saveMsg">Guardar mi mensaje</button>
  <p class="muted" style="margin-top:16px">¿No sabes qué escribir? Elige uno:</p>${MSG5.map((t,i)=>`<button class="pk" style="width:100%;text-align:left;margin:6px 0;padding:12px" data-a="pickMsg" data-v="${i}">${esc(t)}</button>`).join('')}
  <button class="btn sec" data-a="closeModal">Ahora no</button>`}
 else if(m.type==='award'){const x=S.awards[m.i];h+=`<div style="text-align:center"><h2>¡Mes cumplido!</h2><p class="muted">${cap(MESES[pd(x.m).getMonth()])}: puntaje de ${pctTxt(x.sc)}. Ganaste la ficha ${m.i+1} de 12.</p><div style="width:120px;margin:0 auto">${piece(PORD[m.i])}</div></div>
  <div class="card"><div class="muted">Dato de Colombia</div><p style="margin:4px 0 0">${DATOS[m.i]}</p></div><button class="btn" data-a="closeModal">¡Genial!</button><button class="btn sec" data-a="seePuzzle">Ver mi rompecabezas</button>`}
 else if(m.type==='reset'){h+=`<h2>¿Reiniciar la app?</h2><p>Se borrarán todos tus datos de este dispositivo: perfil, metas, tareas e historial. No se puede deshacer.</p><button class="btn danger" data-a="doReset">Sí, borrar todo</button><button class="btn sec" data-a="closeModal">Cancelar</button>`}
 else if(m.type==='pin'){h+=`<h2>${S.profile.pin?'Cambiar clave':'Activar clave'}</h2><label for="mP1">Nueva clave de 4 dígitos</label><input id="mP1" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" data-focus><label for="mP2">Repítela</label><input id="mP2" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
  <div class="banner">Si olvidas la clave no se puede recuperar: la app se reinicia y se pierden los datos.</div>${U.err?`<div class="err">${esc(U.err)}</div>`:''}<button class="btn" data-a="savePin">Guardar clave</button><button class="btn sec" data-a="closeModal">Cancelar</button>`}
 else if(m.type==='import'){h+=`<h2>Restaurar copia</h2><p class="muted">Elige el archivo de tu copia o pega su contenido. Reemplaza todos los datos actuales.</p><input id="impFile" type="file" accept=".json,application/json,text/plain"><textarea id="impText" placeholder="…o pega aquí el contenido de la copia"></textarea>${U.err?`<div class="err">${esc(U.err)}</div>`:''}<button class="btn" data-a="doImport">Restaurar</button><button class="btn sec" data-a="closeModal">Cancelar</button>`}
 return h+'</div></div>'}

const val=id=>{const e=document.getElementById(id);return e?e.value:''};
const okPin=p=>/^\d{4}$/.test(p);
function backupText(){return JSON.stringify({app:'H&E',version:VERSION,exported:new Date().toISOString(),data:S},null,1)}

const ACT={
 obNext(){const o=U.ob;U.err='';
  if(U.step===2){o.name=val('obName').trim();o.age=val('obAge').trim();if(!o.name){U.err='Escribe tu nombre.';return render()}const n=+o.age;if(!o.age||!(n>=5&&n<=120)){U.err='Escribe una edad válida.';return render()}}
  if(U.step===4&&o.pinOn){const p1=val('obP1'),p2=val('obP2');if(!okPin(p1)){U.err='La clave debe tener exactamente 4 números.';return render()}if(p1!==p2){U.err='Las dos claves no coinciden.';return render()}o.pin=p1}
  U.step++;render();window.scrollTo(0,0)},
 obBack(){if(U.step===5)VK.forEach(k=>U.ob.goals[k]=val('obG_'+k));U.err='';U.step--;render();window.scrollTo(0,0)},
 obAnimal(d){U.ob.animal=d.v;applyPal(d.v);render()},
 obPin(d){U.ob.pinOn=d.v==='1';U.err='';render()},
 async obFinish(){const o=U.ob;VK.forEach(k=>o.goals[k]=val('obG_'+k));const miss=VK.filter(k=>!lines(o.goals[k]).length);
  if(miss.length){U.err='Escribe al menos una meta en: '+miss.map(k=>VN[k]).join(', ')+'.';return render()}const many=VK.filter(k=>lines(o.goals[k]).length>MAXG);if(many.length){U.err=`Máximo ${MAXG} metas por vértice. Revisa: `+many.map(k=>VN[k]).join(', ')+'.';return render()}
  const T=today();S={v:1,profile:{name:o.name,age:+o.age,start:T,animal:o.animal,pin:false},goals:{},goalHist:[],changes:{esp:[],cue:[],men:[]},checks:{},tasks:[],phrasesUsed:{esp:[],cue:[],men:[]},weekChecked:monday(T),monthsDone:[],awards:[],porque:''};
  VK.forEach(k=>S.goals[k]=lines(o.goals[k]).map(t=>({id:uid(),text:t})));
  if(o.pinOn&&o.pin)await setPin(o.pin);U.day=T;U.week=T;U.tab='hoy';U.err='';afterLoad();window.scrollTo(0,0)},
 unlock(){const p=val('pin');if(!okPin(p)){U.lockMsg='La clave tiene 4 números.';return render()}tryUnlock(p)},
 tab(d){U.tab=d.v;U.err='';U.editK=null;U.flash='';if(d.v==='hoy')U.day=today();if(d.v==='sem')U.week=today();render();window.scrollTo(0,0)},
 day(d){U.day=addD(U.day,+d.v);if(U.day<S.profile.start)U.day=S.profile.start;render()},
 goToday(){U.day=today();render()},
 week(d){U.week=d.v;render()},
 goal(d){const D=U.day;if(!goalsEditable(D))return;const r=rec(D);r.d[d.v]=!r.d[d.v];save();render()},
 tadd(){const t=val('newTask').trim();if(!t)return;const D=U.day;if(!tasksEditable(D))return;S.tasks.push({id:uid(),date:D,text:t,status:null,order:Date.now()});save();render();const e=document.getElementById('newTask');if(e)e.focus()},
 tstat(d){const t=S.tasks.find(x=>x.id===d.v);if(!t)return;const T=today();const D=U.day;
  if(D===T&&t.date<T&&!t.status){t.from=t.date;t.date=T;t.order=Date.now();t.status=d.s}
  else{if(!tasksEditable(t.date))return;t.status=t.status===d.s?null:d.s}save();render()},
 tmove(d){const t=S.tasks.find(x=>x.id===d.v);if(!t||!tasksEditable(t.date))return;const list=S.tasks.filter(x=>x.date===t.date).sort((a,b)=>a.order-b.order);const i=list.indexOf(t),j=i+(+d.d);if(j<0||j>=list.length)return;
  const o=list[j].order;list[j].order=t.order;t.order=o;if(o===list[j].order)t.order+=(+d.d);save();render()},
 tdel(d){const t=S.tasks.find(x=>x.id===d.v);if(!t||!tasksEditable(t.date))return;S.tasks=S.tasks.filter(x=>x!==t);save();render()},
 saveProfile(){const n=val('aName').trim(),a=+val('aAge');if(n)S.profile.name=n;if(a>=5&&a<=120)S.profile.age=a;U.flash='';save();render()},
 setAnimal(d){S.profile.animal=d.v;applyPal(d.v);save();render()},
 editGoals(d){if(!changeInfo(d.v).ok)return;U.editK=d.v;U.err='';render()},
 cancelGoals(){U.editK=null;U.err='';render()},
 saveGoals(d){const k=d.v;const ci=changeInfo(k);if(!ci.ok){U.editK=null;return render()}const nt=lines(val('eG'));if(!nt.length){U.err='Debe quedar al menos una meta.';return render()}if(nt.length>MAXG){U.err=`Máximo ${MAXG} metas por vértice.`;return render()}
  const old=S.goals[k];if(nt.join('\n')===old.map(g=>g.text).join('\n')){U.editK=null;U.err='';return render()}
  const T=today();const ng=nt.map(t=>{const f=old.find(g=>g.text===t);return f?{id:f.id,text:t}:{id:uid(),text:t}});
  S.goalHist.push({date:T,k,before:old.map(g=>g.text),after:nt});S.changes[k].push(T);S.goals[k]=ng;if(inRange(T)){const r=rec(T);r.g[k]=clone(ng)}
  U.editK=null;U.err='';save();render()},
 pinModal(){U.err='';U.modal={type:'pin'};render()},
 async savePin(){const p1=val('mP1'),p2=val('mP2');if(!okPin(p1)){U.err='La clave debe tener exactamente 4 números.';return render()}if(p1!==p2){U.err='Las dos claves no coinciden.';return render()}
  await setPin(p1);U.modal=null;U.err='';await save();render()},
 pinOff(){S.profile.pin=false;KEY=null;SALT=null;save();render()},
 async exportFile(){const txt=backupText();const name='HE-copia-'+today()+'.json';
  if(DL){try{await DL.save({filename:name,data:txt});U.flash='Copia descargada.';return render()}catch(e){}}
  try{const blob=new Blob([txt],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);U.flash='Si la descarga no empezó, usa "Copiar al portapapeles" y pégalo en una nota.'}catch(e){U.flash='No se pudo descargar aquí. Usa "Copiar al portapapeles".'}render()},
 async exportCopy(){try{await navigator.clipboard.writeText(backupText());U.flash='Copia en el portapapeles. Pégala en una nota o envíatela por correo.'}catch(e){U.flash='No se pudo copiar en este navegador.'}render()},
 importModal(){U.err='';U.modal={type:'import'};render()},
 async doImport(){let txt=val('impText').trim();const f=document.getElementById('impFile');if(!txt&&f&&f.files&&f.files[0]){try{txt=await f.files[0].text()}catch(e){}}
  let o;try{o=JSON.parse(txt)}catch(e){U.err='El contenido no es una copia válida.';return render()}const d=o&&o.data?o.data:o;
  if(!d||!d.profile||!d.goals||!d.checks||!Array.isArray(d.tasks)){U.err='El contenido no es una copia válida de H&E.';return render()}
  const keepPin=S.profile.pin&&KEY;d.profile.pin=!!keepPin;d.changes=d.changes||{esp:[],cue:[],men:[]};d.goalHist=d.goalHist||[];d.phrasesUsed=d.phrasesUsed||{esp:[],cue:[],men:[]};
  S=d;U.modal=null;U.err='';U.flash='Copia restaurada.';applyPal(S.profile.animal);await save();render()},
 askReset(){U.modal={type:'reset'};render()},
 doReset(){wipe();render()},
 closeModal(){U.modal=(U.mq&&U.mq.length)?U.mq.shift():null;U.err='';if(S)save();render()},
 openMsg(){U.err='';U.modal={type:'weekmsg',w:null};render()},
 saveMsg(){const t=val('wmText').trim();if(!t){U.err='Escribe tu mensaje o elige uno de la lista.';return render()}S.weekMsg={week:monday(today()),text:t};ACT.closeModal()},
 pickMsg(d){S.weekMsg={week:monday(today()),text:MSG5[+d.v]};ACT.closeModal()},
 seePuzzle(){U.tab='pro';ACT.closeModal();window.scrollTo(0,0)},
 savePq(){if(today()>=addMonths(S.profile.start,1))return;S.porque=val('pq').trim();U.editPq=false;save();render()},
 editPq(){U.editPq=true;render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=ACT[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el)}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target&&e.target.id;if(id==='newTask'){e.preventDefault();ACT.tadd()}else if(id==='pin'){e.preventDefault();ACT.unlock()}});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='pin'&&/^\d{4}$/.test(e.target.value))ACT.unlock()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&U.mode==='main'){if(inRange(today()))rec(today());checks();save();render()}});

(function init(){let raw=null;try{raw=localStorage.getItem(LS)}catch(e){storageOK=false}
 if(!raw){applyPal('oso');U.mode='ob';return render()}
 let o;try{o=JSON.parse(raw)}catch(e){o=null}
 if(!o){applyPal('oso');U.mode='ob';return render()}
 if(o.enc){let a='oso';try{a=localStorage.getItem(LSA)||'oso'}catch(e){}applyPal(a);U.mode='lock';render()}
 else{S=o.data;afterLoad()}})();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js')}catch(e){}
</script>
